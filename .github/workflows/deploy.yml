name: Deploy ChargePilot to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chargepilot-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PADDLE_ENVIRONMENT: ${{ vars.PADDLE_ENVIRONMENT }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_ANNUAL_PRICE_ID: ${{ vars.PADDLE_ANNUAL_PRICE_ID }}
          VITE_PADDLE_LIFETIME_PRICE_ID: ${{ vars.PADDLE_LIFETIME_PRICE_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=chargepilot-site --branch=main
          githubToken: ${{ secrets.GITHUB_TOKEN }}
